name: Bug Report
description: Report a problem with ok-actually
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
      placeholder: 'ok-actually converted #ff0000 to an unexpected value...'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal CSS input that triggers the issue.
      render: css
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of ok-actually are you using?
      placeholder: '1.0.0'
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      description: How are you using ok-actually?
      options:
        - Vite plugin
        - CLI
        - Programmatic API
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, OS, etc.
      placeholder: 'Node 22, macOS 14'
