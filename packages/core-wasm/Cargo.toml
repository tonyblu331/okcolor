[package]
name = "okcolor-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OKLCH color engine — WASM bindings"
repository = "https://github.com/tonyblu331/okcolor"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wasm-bindgen = "0.2"
aho-corasick = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = true

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
